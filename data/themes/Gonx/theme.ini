# The Gonx look, after Cotito's BeOS concept (github.com/idumych/gonx): what
# gonx-theme apply sets. Colours not listed are Haiku's defaults.

[Theme]
Name=Gonx
Description=The Gonx BeOS concept look: a yellow tab and flap, buttons on a shelf, a blue-grey frame and desktop.

[Window]
Decorator=Gonx
ControlLook=GonxControlLook.so

[Colors]
B_PANEL_BACKGROUND_COLOR=#ecebe6
B_MENU_BACKGROUND_COLOR=#f7f7f5
B_MENU_SELECTED_BACKGROUND_COLOR=#9eb2ca
B_MENU_SELECTED_BORDER_COLOR=#4f5b6b
B_LIST_SELECTED_BACKGROUND_COLOR=#aabbd0
B_KEYBOARD_NAVIGATION_COLOR=#4f6c97
B_WINDOW_TAB_COLOR=#fbcc00
B_WINDOW_TEXT_COLOR=#000000
B_WINDOW_INACTIVE_TAB_COLOR=#ebebeb
B_WINDOW_INACTIVE_TEXT_COLOR=#4c4c4c
B_WINDOW_BORDER_COLOR=#9eb2ca
B_WINDOW_INACTIVE_BORDER_COLOR=#a6b7cc

[Fonts]
Plain=Noto Sans, Regular, 9
Bold=Noto Sans, Bold, 11
Menu=Noto Sans, Regular, 9

[Desktop]
Color=#809dbd
Wallpaper=

[Linux]
Labwc=labwc-themerc
GtkTheme=Gonx
QtStyle=kvantum
KvantumTheme=Gonx
