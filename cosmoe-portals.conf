# xdg-desktop-portal backends for the Hokku session (XDG_CURRENT_DESKTOP=cosmoe):
# wlroots' for the screen (labwc is a wlroots compositor), and for the rest
# (file chooser, settings) whichever of GTK's or KDE's portal is installed, so
# that it works next to another desktop's portals too.
[preferred]
default=gtk;kde;
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Inhibit=none
